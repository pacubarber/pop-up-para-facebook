<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:#0a0a0a;color:#fff}
.red{color:#ff1f1f}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#1c1c1c 0%,#0b0b0b 55%,#050505 100%)}
#grain{position:absolute;inset:0;width:1080px;height:1920px;opacity:.07;mix-blend-mode:screen;z-index:50;pointer-events:none}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 260px 60px #000;z-index:49}
.ruler{position:absolute;right:24px;top:300px;width:40px;height:1300px;background:repeating-linear-gradient(#ffffff40 0 2px,transparent 2px 26px);z-index:2;opacity:.6}
.ruler:after{content:'';position:absolute;right:0;top:0;width:22px;height:100%;background:repeating-linear-gradient(#ffffff70 0 3px,transparent 3px 130px)}
.arc{position:absolute;border:2px solid #ffffff22;border-radius:50%}
.phone{width:500px;height:1010px;border-radius:72px;background:#000;border:12px solid #262626;box-shadow:0 60px 120px #000,0 0 0 2px #444,inset 0 0 0 2px #111;overflow:hidden;position:relative}
.phone .notch{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:140px;height:38px;border-radius:30px;background:#000;z-index:3}
.feed{position:absolute;left:0;top:0;width:100%}
.post{padding:22px 18px 30px}
.post .hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.post .hd i{width:44px;height:44px;border-radius:50%;display:block}
.post .hd b{display:block;width:150px;height:14px;border-radius:8px;background:#333}
.post .im{height:420px;border-radius:18px}
.post .ac{display:flex;gap:18px;margin-top:16px}
.post .ac b{width:34px;height:34px;border-radius:50%;border:4px solid #555;display:block}
.post .ln{height:12px;border-radius:6px;background:#2a2a2a;margin-top:14px}
.card{width:880px;height:230px;border-radius:40px;background:linear-gradient(135deg,#1b1b1b,#111);border:2px solid #2c2c2c;display:flex;align-items:center;gap:40px;padding:0 50px;box-shadow:0 30px 60px #000a}
.card .n{font-family:Inter;font-weight:900;font-size:80px;color:#ff1f1f;letter-spacing:-.05em;width:120px}
.card .tx{font-family:Inter;font-weight:800;font-size:66px;letter-spacing:-.03em;text-align:left}
.card .ic{margin-left:auto;width:110px;height:110px;border-radius:30px;background:#ff1f1f;display:flex;align-items:center;justify-content:center;font-family:Inter;font-weight:900;font-size:70px;box-shadow:0 0 50px #ff1f1f66}
.bubble{background:#f2f2f2;color:#111;border-radius:50px 50px 50px 12px;padding:40px 54px;font-family:Inter;font-weight:700;font-size:64px;letter-spacing:-.02em;box-shadow:0 40px 80px #000}
.hl{position:relative;padding:0 28px}
.hl:before{content:'';position:absolute;inset:6px 0 -6px;background:#ff1f1f;z-index:-1;clip-path:inset(0 var(--c,100%) 0 0)}
.pillk{background:#141414;border:2px solid #333;border-radius:80px;padding:26px 46px;font-family:Inter;font-weight:800;font-size:58px;letter-spacing:-.02em;box-shadow:0 20px 50px #000}
.strike{position:absolute;left:-20px;top:52%;height:16px;background:#ff1f1f;border-radius:8px;width:0;box-shadow:0 0 30px #ff1f1f}
.glow{text-shadow:0 0 60px #ff1f1f88}
</style></head><body><div id="stage"><div class="bg"></div><div class="vig"></div><div class="ruler"></div><canvas id="grain" width="540" height="960"></canvas></div>
<script src="engine.js"></script>
<script>
const R='#ff1f1f';
// --- background decor
el('<div class="arc" style="width:1500px;height:1500px;position:static"></div>',{x:200,y:700,t0:0,t1:40,enter:'fade',dIn:1,z:1,drift:{r:3}});
el('<div class="arc" style="width:900px;height:900px;position:static;border-color:#ff1f1f30"></div>',{x:900,y:1500,t0:0,t1:40,enter:'fade',dIn:1,z:1,drift:{r:-5}});
el(img('v1_megaphone.png',420),{x:960,y:180,t0:0,t1:40,enter:'fade',dIn:1.5,z:1,style:{filter:'blur(14px)',opacity:.35},s:1,float:{amp:30,sp:.6,rot:6},update:(it,t,lt,st)=>{st.o*=.22;st.blur=14}});
el(img('v1_bookmark.png',360),{x:90,y:1640,t0:0,t1:40,enter:'fade',dIn:1.5,z:1,float:{amp:26,sp:.5,ph:2,rot:8},update:(it,t,lt,st)=>{st.o*=.2;st.blur=14}});
// handle
el(`<div class="handle" style="background:#ffffff14;border:1px solid #ffffff22"><div class="av" style="background:linear-gradient(135deg,#ff1f1f,#600)"></div>@tucuenta</div>`,{x:220,y:1730,t0:0.2,t1:40,enter:'up',z:30});

// S1 hook 0–2.05
el(`<div>${sp('Tienes',0,'it','up')}</div>`,{x:540,y:330,t0:0,t1:2.0,exit:'down',enter:'none',cls:'it',style:{fontSize:'120px'}});
el(`<div class="h" style="font-size:190px">${sp('TRES',0.42,'red glow','pop')}<br>${sp('SEGUNDOS',0.85,'','up')}</div>`,{x:540,y:560,t0:0,t1:2.0,enter:'none',exit:'blur'});
const sw=el(img('v1_stopwatch.png',640),{x:540,y:1230,t0:0,t1:3.55,enter:'spin',dIn:.7,exit:'zoom',float:{amp:12,sp:2,rot:3},
  update:(it,t,lt,st)=>{ if(t>2.1&&t<3.4){st.r+=Math.sin(t*60)*2.2;} }});
el(`<div class="h num" style="font-size:300px;color:#fff;text-shadow:0 8px 40px #0008">3</div>`,{x:540,y:1290,t0:0.45,t1:3.55,enter:'pop',exit:'zoom',z:6,float:{amp:12,sp:2},
  update:(it,t)=>{const n=t<1.5?3:t<2.5?2:1;it.d.querySelector('.num').textContent=n;const f=(t-0.45)%1;st0=1+0.25*Math.max(0,1-f*5);it.d.firstChild.style.transform=`scale(${st0})`;}});
// S2 "Solo tres."
el(`<div><span class="it" style="font-size:130px">${sp('Solo',2.1,'','up')}</span> <span class="h red glow" style="font-size:230px">${sp('tres.',2.2,'','pop')}</span></div>`,{x:540,y:470,t0:2.1,t1:3.55,enter:'none',exit:'up'});

// S3 scroll phone 3.6–7.1
const colors=['linear-gradient(135deg,#ff6b6b,#7a1d1d)','linear-gradient(135deg,#f4d03f,#e67e22)','linear-gradient(135deg,#5dade2,#1b4f72)','linear-gradient(135deg,#a569bd,#4a235a)','linear-gradient(135deg,#58d68d,#145a32)','linear-gradient(135deg,#ec7063,#f5b041)','linear-gradient(135deg,#5d6d7e,#17202a)'];
let posts='';for(let i=0;i<28;i++){const c=colors[i%colors.length];posts+=`<div class="post"><div class="hd"><i style="background:${c}"></i><b></b></div><div class="im" style="background:${c}"></div><div class="ac"><b></b><b></b><b></b></div><div class="ln" style="width:80%"></div><div class="ln" style="width:55%"></div></div>`;}
const ph=el(`<div class="phone"><div class="notch"></div><div class="feed">${posts}</div></div>`,{x:540,y:1230,t0:3.6,t1:7.05,enter:'up',dIn:.7,exit:'left',
  update:(it,t,lt)=>{const fast=Math.max(0,t-6.0);const off=lt*160+fast*fast*1500+fast*900;it.d.querySelector('.feed').style.transform=`translateY(${-off}px)`;it.d.querySelector('.feed').style.filter=fast>0?`blur(${Math.min(8,fast*14)}px)`:'';}});
el(`<div class="m" style="font-size:72px;line-height:1.15">${sp('Ese',3.65)} ${sp('es',3.72)} ${sp('el',3.95)} ${sp('tiempo',4.05)}<br>${sp('que',4.12)} ${sp('alguien',4.35)} ${sp('te',4.55)} ${sp('da',4.8)} <span class="it" style="font-size:86px">${sp('antes',5.0)} ${sp('de',5.3)}</span></div>`,{x:540,y:330,t0:3.6,t1:7.05,enter:'none',exit:'up'});
el(`<div><span class="it" style="font-size:80px">${sp('seguir haciendo',5.5)}</span><br><span class="h red glow" style="font-size:170px">${sp('SCROLL.',6.02,'','pop')}</span></div>`,{x:540,y:570,t0:3.6,t1:7.05,enter:'none',exit:'up',z:8});
// finger swipe
el('<div style="width:120px;height:120px;border-radius:50%;background:#ffffff30;border:4px solid #fff;box-shadow:0 0 40px #fff8"></div>',{x:640,y:1450,t0:5.9,t1:6.9,enter:'pop',dIn:.2,z:9,update:(it,t,lt,st)=>{const p=(lt%0.45)/0.45;st.y=1500-ease.out(p)*420;st.o*=1-p*0.6;}});

// S4 7.15–9.3
el(`<div class="it" style="font-size:120px">${sp('Y',7.15)} ${sp('el',7.3)} ${sp('problema',7.6)}</div>`,{x:540,y:620,t0:7.15,t1:9.3,enter:'none',exit:'up'});
el(`<div class="h red glow" style="font-size:250px">${sp('NO',7.8,'','pop')} ${sp('ES',8.0,'','pop')}</div>`,{x:540,y:860,t0:7.15,t1:9.3,enter:'none',exit:'blur'});
el(`<div class="h" style="font-size:130px;position:relative">${sp('tu',8.12)} ${sp('contenido.',8.32)}<div class="strike"></div></div>`,{x:540,y:1110,t0:7.15,t1:9.3,enter:'none',exit:'down',
  update:(it,t)=>{it.d.querySelector('.strike').style.width=(ease.expo(clamp((t-8.85)/.35))*112)+'%';it.d.firstChild.style.opacity=t>8.85?.55:1}});
// S5 9.35–11.8
el(`<div class="it" style="font-size:130px">${sp('Es',9.35)} ${sp('tu',9.52)}</div>`,{x:540,y:420,t0:9.35,t1:11.8,enter:'none',exit:'up'});
el(`<div class="h" style="font-size:200px">${sp('PRIMERA',9.75,'','up')}</div>`,{x:540,y:610,t0:9.35,t1:11.8,enter:'none',exit:'left'});
el(`<div class="h" style="font-size:200px"><span class="hl w" data-t="10.2" data-a="pop">FRASE.</span></div>`,{x:540,y:810,t0:9.35,t1:11.8,enter:'none',exit:'right',
  update:(it,t)=>{it.d.querySelector('.hl').style.setProperty('--c',(100-ease.expo(clamp((t-10.3)/.4))*100)+'%')}});
el(img('v1_megaphone.png',700),{x:540,y:1340,t0:9.7,t1:11.8,enter:'spin',dIn:.7,exit:'zoom',float:{amp:18,sp:2.2,rot:4},
  update:(it,t,lt,st)=>{const k=Math.max(0,1-((t-10.25)%0.6)*4);if(t>10.25)st.s*=1+0.05*k;}});

// S6 stat 11.9–19.3
el(`<div class="h red glow" style="font-size:340px"><span class="num">0</span>%</div>`,{x:540,y:520,t0:11.9,t1:19.3,enter:'zoom',dIn:.5,exit:'blur',update:countUp(0,65,11.95,1.0)});
el(`<div class="m" style="font-size:64px;line-height:1.2">${sp('de',12.75)} ${sp('las',13.1)} ${sp('personas',13.4)} ${sp('que',13.7)} ${sp('ven',14.05)}<br>${sp('los',14.2)} ${sp('primeros',14.6)} <span class="red">${sp('3',15.2,'','pop')} ${sp('segundos',15.55)}</span><br><span class="it" style="font-size:72px">${sp('de un video',16.0)}</span></div>`,{x:540,y:810,t0:11.9,t1:19.3,enter:'none',exit:'up'});
el(img('v1_statue.png',760),{x:540,y:1390,t0:16.5,t1:19.3,enter:'up',dIn:.8,exit:'down',float:{amp:10,sp:1.4}});
el(`<div class="pillk">${sp('se quedan',16.6)} <span class="it" style="font-size:66px;font-weight:400">${sp('por lo menos',17.5)}</span> <span class="red">${sp('10s',18.15,'','pop')}</span></div>`,{x:540,y:1000,t0:16.55,t1:19.3,enter:'pop',dIn:.4,exit:'fade',z:8});

// S7 19.45–25.2
el(`<div class="it" style="font-size:120px">${sp('Así',19.45)} ${sp('que',19.65)}</div>`,{x:540,y:420,t0:19.45,t1:22.0,enter:'none',exit:'up'});
el(`<div class="h red glow" style="font-size:210px">${sp('DEJA DE',20.1,'','pop')}</div>`,{x:540,y:620,t0:19.45,t1:25.15,enter:'none',exit:'blur'});
el(`<div class="h" style="font-size:150px">${sp('presentarte.',20.6)}</div>`,{x:540,y:810,t0:19.45,t1:22.0,enter:'none',exit:'down'});
el(`<div class="h" style="font-size:150px">${sp('decir:',22.5)}</div>`,{x:540,y:810,t0:22.05,t1:25.15,enter:'none',exit:'down'});
const bub=el(`<div class="bubble">${sp('“Hola,',22.75)} ${sp('en',23.45)} ${sp('este',23.72)} ${sp('video…”',23.95)}</div>`,{x:540,y:1220,t0:22.15,t1:25.15,enter:'pop',dIn:.45,exit:'down',
  update:(it,t,lt,st)=>{if(t>24.35){const k=Math.max(0,1-(t-24.35)*3);st.x+=Math.sin(t*90)*22*k;it.d.firstChild.style.filter='grayscale(1) brightness(.55)';}else it.d.firstChild.style.filter='';}});
el(`<svg width="360" height="360" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="${R}" stroke-width="9"/><path d="M30 30 L70 70 M70 30 L30 70" stroke="${R}" stroke-width="11" stroke-linecap="round"/></svg>`,{x:540,y:1220,t0:24.3,t1:25.15,enter:'zoom',dIn:.3,exit:'fade',r:-12,z:9,style:{filter:'drop-shadow(0 0 30px #ff1f1f)'}});

// S8 25.25–29.85
el(`<div class="it" style="font-size:130px">${sp('Empieza',25.25)} ${sp('con:',25.55)}</div>`,{x:540,y:420,t0:25.25,t1:29.85,enter:'none',exit:'up'});
const cards=[['01','Un problema','!',26.15],['02','Una pregunta','?',27.1],['03','Un número<br>que <span class="red">duela</span>','%',28.4]];
cards.forEach(([n,tx,ic,t],i)=>el(`<div class="card"><div class="n">${n}</div><div class="tx">${tx}</div><div class="ic">${ic}</div></div>`,{x:540,y:720+i*290,t0:t,t1:29.85,enter:'left',dIn:.55,exit:'right',dOut:.3+i*.05,float:{amp:5,sp:1.5,ph:i}}));

// S9 29.9–32.3
el(`<div class="it" style="font-size:130px">${sp('Justo',29.9)} ${sp('como',30.32)}</div>`,{x:540,y:560,t0:29.9,t1:32.3,enter:'none',exit:'up'});
el(`<div class="h" style="font-size:210px">${sp('HICE',30.62,'','pop')} ${sp('YO',30.85,'','pop')}</div>`,{x:540,y:770,t0:29.9,t1:32.3,enter:'none',exit:'left'});
el(`<div class="h red glow" style="font-size:210px">${sp('CONTIGO.',31.15,'','pop')}</div>`,{x:540,y:960,t0:29.9,t1:32.3,enter:'none',exit:'right'});
el(img('v1_stopwatch.png',330),{x:260,y:1380,t0:30.3,t1:32.3,enter:'spin',exit:'zoom',float:{amp:16,sp:2,rot:6}});
el(`<div class="pillk red" style="font-size:90px">65%</div>`,{x:790,y:1330,t0:30.6,t1:32.3,enter:'pop',exit:'zoom',r:6,float:{amp:16,sp:2,ph:1}});
el(`<div class="pillk" style="font-size:60px">3 seg.</div>`,{x:760,y:1530,t0:30.85,t1:32.3,enter:'pop',exit:'zoom',r:-5,float:{amp:16,sp:2,ph:2}});

// S10 32.35–end
el(`<div class="h" style="font-size:220px">${sp('GUARDA',32.35,'','pop')}</div>`,{x:540,y:470,t0:32.35,t1:40,enter:'none'});
el(`<div class="it" style="font-size:120px">${sp('este',32.5)} ${sp('video',32.66)}</div>`,{x:540,y:650,t0:32.35,t1:40,enter:'none'});
el(img('v1_bookmark.png',560),{x:540,y:1120,t0:32.4,t1:40,enter:'spin',dIn:.7,float:{amp:16,sp:1.8,rot:4},style:{filter:'drop-shadow(0 0 80px #ff1f1f66)'}});
el(`<div class="m" style="font-size:76px">${sp('Lo',33.3)} ${sp('vas',33.5)} ${sp('a',33.6)} <span class="red">${sp('necesitar.',33.78)}</span></div>`,{x:540,y:1500,t0:32.35,t1:40,enter:'none'});

// grain
const g=document.getElementById('grain'),gx=g.getContext('2d'),gd=gx.createImageData(540,960);
window.onFrame=t=>{let s=Math.floor(t*30)*9301+49297;for(let i=0;i<gd.data.length;i+=4){s=(s*1103515245+12345)&0x7fffffff;const v=s>>23;gd.data[i]=gd.data[i+1]=gd.data[i+2]=v;gd.data[i+3]=255;}gx.putImageData(gd,0,0);};
seek(0);
</script></body></html>
